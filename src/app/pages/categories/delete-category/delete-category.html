<div class="container" style="padding: 15px;">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <p class="text-uppercase small mb-1">Delete Category</p>
            <h3 class="text-center text-md-start mb-0">Are you sure you want to delete this category
                <strong>{{data.category.categoryName}}</strong>? The data will be deleted permanently along with its linked Collections data also!
            </h3>
            <div class="d-flex flex-column gap-1 mt-2">
                <label for="name" class="fw-semibold">Please type <strong>Yes-Delete-This-Category</strong> to
                    confirm</label>
                <input pInputText id="name" [(ngModel)]="deleteCategoryConfirmation" />
                <div *ngIf="deleteErrorMessage !== ''" class="text-danger small mt-1">{{ deleteErrorMessage }}</div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-center gap-3">
        <button pButton class="p-button-danger" label="Yes, Delete" (click)="deleteCategory()"></button>
        <button pButton class="p-button-secondary" label="No, Cancel" (click)="cancelDelete()"></button>
    </div>
</div>
