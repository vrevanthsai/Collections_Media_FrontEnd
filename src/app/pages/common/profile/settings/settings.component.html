<div class="row">
  <div class="col-12 col-lg-8" style="margin: auto;">
    <div class="panel-card">
      <h2 class="panel-card__title"><i class="pi pi-cog"></i> Settings</h2>

      <div class="mt-4">
        <div class="setting-toggle-row">
          <span>Dark Mode</span>
          <p-toggleswitch [(ngModel)]="darkMode"></p-toggleswitch>
        </div>

        <!-- Export All Collections feature- Will be Developed later here -->
        <div>
          <div class="setting-toggle-row">
            <div class="col-10">
              <span>Do you want to export your All Collections Data to excel or any other format?- Will be Developed Soon!! </span>
            </div>
            <div class="col-2">
              <button pButton type="button" class="w-100 mt-3">Export</button>
            </div>
          </div>
        </div>

        <button pButton type="button" label="Save Settings" class="w-100 save-btn mt-3"
          (click)="saveSettings()"></button>
      </div>
    </div>

    <!-- Delete Account Panel -->
    <div class="panel-card mt-3">
      <h2 class="panel-card__title"><i class="pi pi-exclamation-triangle"></i> Delete</h2>

      <div class="mt-2">
        <div class="setting-toggle-row">
          <div class="col-10">
            <span>Do you want to delete your Account? and are you sure? </span>
          </div>
          <div class="col-2">
            <button pButton type="button" label="Delete Account" (click)="deleteMyAccountDialog()" class="w-100 mt-3" severity="danger"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete User/MyAccount Dialog -->
<p-dialog header="Delete User" [modal]="true" [(visible)]="deleteDialogVisible" [style]="{ width: '25rem' }">
  <div class="d-flex flex-column gap-3">
    <span class="d-block mb-2">Are you sure you want to <strong>delete</strong> your Account with UserName: {{deleteUserName}}?</span>
    <div class="d-flex flex-column gap-1">
      <label for="name" class="small fw-semibold">Please type <strong>Yes-Delete-My-Account</strong> to confirm</label>
      <input pInputText id="name" [(ngModel)]="deleteUserConfirmation" />
      <div *ngIf="deleteErrorMessage !== ''" class="text-danger small mt-1">{{ deleteErrorMessage }}</div>
    </div>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" pButton severity="secondary" (click)="deleteDialogVisible = false">Cancel</button>
      <button type="button" pButton (click)="deleteMyAccountHandler()" label="Confirm"
        [loading]="deleteUserLoading"></button>
    </div>
  </div>
</p-dialog>
