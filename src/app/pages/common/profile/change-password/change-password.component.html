<p-toast></p-toast>

<div class="row">
  <div class="col-12 col-lg-6" style="margin: auto;">
    <div class="panel-card">
      <h2 class="panel-card__title"><i class="pi pi-key"></i> Change Password</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-4">
        <div class="mb-4">
          <label class="field-label">Current Password</label>
          <p-password
            formControlName="currentPassword"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-100"
            inputStyleClass="w-100 field-input"
          ></p-password>
        </div>

        <div class="mb-4">
          <label class="field-label">New Password</label>
          <p-password
            formControlName="newPassword"
            [toggleMask]="true"
            styleClass="w-100"
            inputStyleClass="w-100 field-input"
          ></p-password>
          <small
            class="text-danger d-block mt-1"
            *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('minlength')"
          >
            Must be at least 5 characters.
          </small>
        </div>

        <div class="mb-4">
          <label class="field-label">Confirm New Password</label>
          <p-password
            formControlName="confirmPassword"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-100"
            inputStyleClass="w-100 field-input"
          ></p-password>
          <small class="text-danger d-block mt-1" *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched">
            Passwords do not match.
          </small>
        </div>

        <button pButton type="submit" label="Update Password" class="w-100 save-btn" [loading]="saving"></button>
      </form>
    </div>
  </div>
</div>
